name: Tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: true
            matrix:
                php: [8.6, 8.5]

        name: PHP ${{ matrix.php }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, pcntl, exif, iconv, fileinfo, xml, pdo, pdo_sqlite
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: 24
                  cache: true

            - name: Build application
              run: |
                  cp .env.ci .env
                  php artisan key:generate
                  php artisan wayfinder:generate
                  vp build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Execute tests
              run: php artisan test

            - name: Upload browser test screenshots
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: browser-screenshots-php-${{ matrix.php }}
                  path: tests/Browser/Screenshots
                  if-no-files-found: ignore
