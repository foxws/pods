# Lets the Pods proxy reach Pods' development units, and gives it their
# hostnames. Copy it to ~/.config/containers/systemd/pods-proxy.container.d/
# and change the hostnames to yours.
[Container]
Network=pods-dev.network
Environment=PODS_DEV_HOST=pods.test
Environment=PODS_DEV_VITE_HOST=vite.pods.test
Environment=PODS_DEV_WS_HOST=ws.pods.test
Environment=PODS_DEV_MAIL_HOST=mail.pods.test
# Behind another proxy that handles HTTPS, such as on a host shared with
# other users:
# Environment=PROXY_SCHEME=http
